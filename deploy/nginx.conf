# nginx config for the `web` (frontend) container.
# Serves the built Vue app and forwards Socket.IO traffic to the `server` container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's internal DNS. Resolving per request means a restarted `server` container
    # (which can get a new IP) is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8004;

    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Games sit idle for long stretches (night, discussion); don't drop quiet sockets.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build assets never change, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app (e.g. /?room=ABCD).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
