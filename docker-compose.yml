# Run on the VPS with:  docker compose up -d --build
#
#   web    (frontend) nginx serving the Vue app, published on 127.0.0.1:2000
#   server (backend)  NestJS + Socket.IO, only reachable inside the compose network
#
# The browser only talks to `web`; it forwards /socket.io to `server`. Port 2000 is bound to
# 127.0.0.1 so it is reachable through the reverse proxy (deploy/Caddyfile) and not directly from
# the internet. To test without a proxy, change it to "2000:80" and open http://<vps-ip>:2000.
services:
  server:
    build:
      context: .
      target: server
    image: mafia-server:latest
    restart: unless-stopped
    environment:
      PORT: 8004
      # Speeds up narration pauses for testing; leave at 1 for real games.
      MAFIA_SPEED: 1
    expose:
      - "8004"

  web:
    build:
      context: .
      target: web
    image: mafia-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:2000:80"
